name: Build and verify Godot FFB

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ffb-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Match build-container ownership to the runner
        run: printf 'LOCAL_UID=%s\nLOCAL_GID=%s\n' "$(id -u)" "$(id -g)" >> "$GITHUB_ENV"
      - name: Build portable debug/release addon and test Godot 4.4.1
        run: |
          docker compose build release
          docker compose run --rm release
      - name: Verify the same binaries with Godot 4.7.2
        run: |
          docker compose build test
          docker compose run --rm test bash scripts/test_compatibility.sh 4.7.2-stable
      - name: Upload reviewable release candidate
        uses: actions/upload-artifact@v7
        with:
          name: godot-ffb-linux-x86_64
          path: |
            dist/godot-ffb-*.zip
            dist/SHA256SUMS
            dist/release.json
          if-no-files-found: error

  prepare-draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: godot-ffb-linux-x86_64
          path: dist
      - name: Create immutable gd-plug tag and draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_release.py
